# training/configs/hazard_yolov8n.yaml
model_name: hazard_yolov8n
architecture: YOLOv8n
task: detect
dataset: D-Fire / TTPLA / Aerial Hazard Composite
dataset_url: "https://github.com/gaiasd/DFireDataset"
license: MIT / Academic
classes:
  - fire
  - smoke
  - debris
  - structural_damage
  - power_line
input_size: [1, 3, 640, 640]
imgsz: 640
seed: 42
opset: 17
hyperparameters:
  epochs: 50
  batch_size: 16
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  box_loss_gain: 7.5
  cls_loss_gain: 0.5
min_confidence: 0.35
min_map50_threshold: 0.30
