# training/configs/thermal_yolov8n.yaml
model_name: thermal_yolov8n
architecture: YOLOv8n
task: detect
modality: thermal
dataset: HIT-UAV (High-altitude Infrared Thermal UAV) / FLIR Thermal
dataset_url: "https://github.com/suojiangfei/HIT-UAV"
license: CC-BY-4.0
classes:
  - person
input_size: [1, 3, 640, 640]
imgsz: 640
seed: 42
opset: 17
hyperparameters:
  epochs: 50
  batch_size: 16
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  box_loss_gain: 7.5
  cls_loss_gain: 0.5
min_confidence: 0.35
min_map50_threshold: 0.30
